<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu código de acesso — Structa</title>
</head>
<body style="margin:0;padding:0;background:#f4ede4;font-family:Inter,'Helvetica Neue',Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4ede4;padding:48px 16px;">
    <tr>
      <td align="center">

        <table width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 32px rgba(56,28,23,0.10);">

          <!-- Header -->
          <tr>
            <td style="background:#381c17;padding:32px 40px 28px;">
              <svg width="140" viewBox="0 0 270 56" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="6.25" width="15.67" height="43.5" fill="#f4ede4"/>
                <path d="M64,49.75 V6.25 H53.12 C39.83,6.25 31.87,23.3 15.67,49.75 Z" fill="#f4ede4"/>
                <text x="78" y="38" font-family="Inter,sans-serif" font-weight="700" font-size="34" letter-spacing="-0.8" fill="#f4ede4">Structa</text>
                <text x="79" y="52" font-family="Inter,sans-serif" font-weight="300" font-size="10" letter-spacing="2.5" fill="#f4ede4" opacity="0.65">Consultoria Financeira</text>
              </svg>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              <p style="margin:0 0 6px;font-size:20px;font-weight:700;color:#381c17;letter-spacing:-0.02em;">Seu código de acesso</p>
              <p style="margin:0 0 28px;font-size:14px;color:#7a6a60;line-height:1.7;">Digite o código abaixo no dashboard para acessar. Válido por <strong style="color:#381c17;">10 minutos</strong>.</p>

              <!-- Código em destaque -->
              <table cellpadding="0" cellspacing="0" width="100%" style="margin-bottom:32px;">
                <tr>
                  <td align="center" style="background:#f4ede4;border-radius:12px;padding:24px 16px;">
                    <span style="font-size:40px;font-weight:700;color:#381c17;letter-spacing:.25em;font-family:Inter,monospace;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <hr style="border:none;border-top:1px solid #e8ddcd;margin:0 0 24px;">

              <p style="margin:0;font-size:12px;color:#a09080;line-height:1.6;">
                Se você não solicitou este código, ignore este e-mail. Nenhuma ação é necessária.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f4ede4;padding:20px 40px;border-top:1px solid #e8ddcd;">
              <p style="margin:0;font-size:11px;color:#a09080;line-height:1.6;">
                <strong style="color:#381c17;">Structa Consultoria Financeira</strong><br>
                Dashboard de gestão financeira para profissionais de saúde.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
